sentence=Memory-safe SNMPv2c agent with derived compile-time sizing and built-in system group.
paragraph=A full SNMPv2c agent: GET/GETNEXT/GETBULK/SET, v1/v2c TRAP and INFORM. Varbind cap and pool size are derived from the packet budget and your handler count (no magic numbers); the memory arena is locked in at boot so long-running nodes never fragment. Stateless trap/inform sends, loud tooBig rejection instead of silent drops, CI-validated (arduino-lint, host Catch2 suite, ESP8266+ESP32 example matrix).
category=Communication
architectures=esp32,esp8266
includes=SNMP_Embedded.h, SNMPTrap.h
